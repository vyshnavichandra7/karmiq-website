{% extends 'base.html' %}
{% block content %}

<div class="main">
  <div class="ph">
    <h1>✏️ Edit Job</h1>
    <p>Update the details for this job posting.</p>
  </div>

  <div class="form-card" style="max-width:520px">
    <form method="POST" style="display:flex;flex-direction:column;gap:18px">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label">Work Type</label>
        <select name="title" class="form-select" required>
          <option value="Mason"     {% if job.title == "Mason" %}selected{% endif %}>🧱 Mason</option>
          <option value="Carpenter" {% if job.title == "Carpenter" %}selected{% endif %}>🪚 Carpenter</option>
          <option value="Plumber"   {% if job.title == "Plumber" %}selected{% endif %}>🚰 Plumber</option>
          <option value="Electrician" {% if job.title == "Electrician" %}selected{% endif %}>⚡ Electrician</option>
          <option value="Painter"   {% if job.title == "Painter" %}selected{% endif %}>🖌️ Painter</option>
          <option value="Helper"    {% if job.title == "Helper" %}selected{% endif %}>👷 General Helper</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Salary (₹)</label>
        <input type="number" name="salary" class="form-input" value="{{ job.salary }}" required>
      </div>

      <div class="form-group">
        <label class="form-label">Work Timing</label>
        <select name="timing" class="form-select" required>
          <option value="6 AM - 12 PM"  {% if job.timing == "6 AM - 12 PM" %}selected{% endif %}>🌅 6 AM – 12 PM (Morning Shift)</option>
          <option value="7 AM - 3 PM"   {% if job.timing == "7 AM - 3 PM" %}selected{% endif %}>☀️ 7 AM – 3 PM (Day Shift)</option>
          <option value="9 AM - 5 PM"   {% if job.timing == "9 AM - 5 PM" %}selected{% endif %}>🕘 9 AM – 5 PM (Office Hours)</option>
          <option value="10 AM - 6 PM"  {% if job.timing == "10 AM - 6 PM" %}selected{% endif %}>🕙 10 AM – 6 PM</option>
          <option value="12 PM - 8 PM"  {% if job.timing == "12 PM - 8 PM" %}selected{% endif %}>🌤️ 12 PM – 8 PM (Afternoon Shift)</option>
          <option value="2 PM - 10 PM"  {% if job.timing == "2 PM - 10 PM" %}selected{% endif %}>🌙 2 PM – 10 PM (Evening Shift)</option>
          <option value="Full Day"      {% if job.timing == "Full Day" %}selected{% endif %}>📅 Full Day (Flexible)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Job Date</label>
        <input type="date" name="job_date" class="form-input" value="{{ job.job_date|date:'Y-m-d' }}">
      </div>

      <div class="form-group">
        <label class="form-label">Workers Needed</label>
        <input type="number" name="max_workers" class="form-input" value="{{ job.max_workers }}" min="1" required>
      </div>

      <label class="form-checkbox">
        <input type="checkbox" name="is_urgent" {% if job.is_urgent %}checked{% endif %}>
        <span>🔥 Mark as Urgent</span>
      </label>

      <div style="display:flex; gap:12px;">
        <button type="submit" class="btn btn-primary" style="flex:1">💾 Save Changes</button>
        <a href="/dashboard/" class="btn btn-ghost" style="flex:1; text-align:center;">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
