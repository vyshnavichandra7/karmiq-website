{% extends 'base.html' %}
{% block content %}

<div class="main main-wide">
  <div class="ph">
    <h1>{{ T.map_title }}</h1>
    <p>{{ T.map_subtitle }}</p>
  </div>

  <!-- COLOR LEGEND -->
  <div style="display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px; padding:16px 20px; background:var(--bg2); border:1px solid var(--border); border-radius:14px; align-items:center;">
    <span style="font-size:13px; font-weight:700; color:var(--t2); text-transform:uppercase; letter-spacing:1px; margin-right:4px;">Map Legend:</span>

    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:16px; height:16px; border-radius:50%; background:#3498db; border:2px solid white; flex-shrink:0;"></div>
      <span style="font-size:13px; color:var(--t1); font-weight:600;">Your Current Location</span>
    </div>

    <div style="width:1px; height:20px; background:var(--border);"></div>

    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:16px; height:16px; border-radius:50%; background:#4caf6e; border:2px solid white; flex-shrink:0;"></div>
      <span style="font-size:13px; color:var(--t1); font-weight:600;">Available Job</span>
    </div>

    <div style="width:1px; height:20px; background:var(--border);"></div>

    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:16px; height:16px; border-radius:50%; background:#e05252; border:2px solid white; flex-shrink:0;"></div>
      <span style="font-size:13px; color:var(--t1); font-weight:600;">🔥 Urgent Job</span>
    </div>

    <div style="width:1px; height:20px; background:var(--border);"></div>

    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:16px; height:16px; border-radius:50%; background:#888; border:2px solid white; flex-shrink:0;"></div>
      <span style="font-size:13px; color:var(--t1); font-weight:600;">✅ Completed Job</span>
    </div>

    <div style="margin-left:auto; font-size:12px; color:var(--t2);">Click any pin for full details</div>
  </div>

  <div id="map" style="border-radius:16px; overflow:hidden; border:1px solid var(--border);"></div>
</div>

<script>
function initMap() {
  var center = { lat: 17.3850, lng: 78.4867 };
  var map = new google.maps.Map(document.getElementById("map"), {
    zoom: 12,
    center: center,
    styles: [
      {elementType:"geometry",stylers:[{color:"#1a1e1c"}]},
      {elementType:"labels.text.fill",stylers:[{color:"#9a968f"}]},
      {elementType:"labels.text.stroke",stylers:[{color:"#0c0e0d"}]},
      {featureType:"road",elementType:"geometry",stylers:[{color:"#2a2f2c"}]},
      {featureType:"water",elementType:"geometry",stylers:[{color:"#0d1412"}]},
      {featureType:"poi",elementType:"geometry",stylers:[{color:"#1a1e1c"}]}
    ]
  });

  var jobs = JSON.parse('{{ jobs_json|escapejs }}');
  var openInfo = null;

  jobs.forEach(function(job) {
    // Color: grey = completed, red = urgent, green = available
    var markerColor = job.is_completed ? '#888888' : (job.is_urgent ? '#e05252' : '#4caf6e');

    // Role icon mapping
    var roleIcon = '👷';
    if (job.title === 'Mason') roleIcon = '🧱';
    else if (job.title === 'Carpenter') roleIcon = '🪚';
    else if (job.title === 'Plumber') roleIcon = '🚰';
    else if (job.title === 'Electrician') roleIcon = '⚡';
    else if (job.title === 'Painter') roleIcon = '🖌️';

    var marker = new google.maps.Marker({
      position: { lat: parseFloat(job.lat), lng: parseFloat(job.lng) },
      map: map,
      title: job.title,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 11,
        fillColor: markerColor,
        fillOpacity: 1,
        strokeColor: '#ffffff',
        strokeWeight: 2.5
      }
    });

    // Build rich info popup
    var statusBadge = job.is_completed
      ? '<span style="background:#888;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;">✅ Completed</span>'
      : job.is_urgent
        ? '<span style="background:#e05252;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;">🔥 Urgent</span>'
        : '<span style="background:#4caf6e;color:#fff;padding:2px 8px;border-radius:20px;font-size:11px;">✅ Open</span>';

    var dateRow = job.job_date ? '<tr><td style="color:#777;padding-right:10px;">📅 Date</td><td style="font-weight:600;">' + job.job_date + '</td></tr>' : '';
    var timingRow = job.timing ? '<tr><td style="color:#777;padding-right:10px;">🕒 Timing</td><td style="font-weight:600;">' + job.timing + '</td></tr>' : '';

    var content =
      '<div style="font-family:sans-serif; padding:10px 4px; max-width:240px; color:#111;">' +
        '<div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">' +
          '<span style="font-size:22px;">' + roleIcon + '</span>' +
          '<div>' +
            '<div style="font-size:15px; font-weight:800; line-height:1.2;">' + job.title + '</div>' +
            statusBadge +
          '</div>' +
        '</div>' +
        '<table style="font-size:13px; border-collapse:collapse; width:100%;">' +
          '<tr><td style="color:#777;padding-right:10px;">📍 Location</td><td style="font-weight:600;">' + job.location + '</td></tr>' +
          '<tr><td style="color:#777;padding-right:10px;">👤 Posted by</td><td style="font-weight:600;">' + job.contractor_name + '</td></tr>' +
          '<tr><td style="color:#777;padding-right:10px;">💰 Salary</td><td style="font-weight:700; color:#c8871a;">₹' + job.salary + '</td></tr>' +
          '<tr><td style="color:#777;padding-right:10px;">👷 Workers</td><td style="font-weight:600;">' + job.applicants + ' / ' + job.max_workers + ' applied</td></tr>' +
          timingRow +
          dateRow +
        '</table>' +
        '<div style="margin-top:10px; border-top:1px solid #eee; padding-top:8px;">' +
          '<a href="/jobs/" style="color:#c8871a; font-size:12px; font-weight:700; text-decoration:none;">View All Jobs →</a>' +
        '</div>' +
      '</div>';

    var info = new google.maps.InfoWindow({ content: content });

    marker.addListener("click", function() {
      if (openInfo) openInfo.close();
      info.open(map, marker);
      openInfo = info;
    });
  });

  // Blue pin — User's Current Location
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      var pos = {
        lat: position.coords.latitude,
        lng: position.coords.longitude
      };

      var userMarker = new google.maps.Marker({
        position: pos,
        map: map,
        title: "Your Location",
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 13,
          fillColor: '#3498db',
          fillOpacity: 1,
          strokeColor: '#ffffff',
          strokeWeight: 3
        },
        zIndex: 999
      });

      var userInfo = new google.maps.InfoWindow({
        content: '<div style="font-family:sans-serif;font-size:13px;padding:6px 4px;color:#111;">' +
                 '<div style="font-size:15px; font-weight:800; margin-bottom:4px;">📍 Your Location</div>' +
                 '<div style="color:#555;">You are here</div>' +
                 '<div style="margin-top:6px; padding:4px 10px; background:#3498db; color:#fff; border-radius:20px; font-size:11px; text-align:center; font-weight:700;">🔵 Current Location</div>' +
                 '</div>'
      });

      userMarker.addListener("click", function() {
        if (openInfo) openInfo.close();
        userInfo.open(map, userMarker);
        openInfo = userInfo;
      });

      map.setCenter(pos);
    }, function() {
      console.warn("Geolocation denied or failed.");
    });
  }
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBNty79xfQEyLHCtnCvaOEHEiCI5mG6ypA&callback=initMap" async defer></script>

{% endblock %}
